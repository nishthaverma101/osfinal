<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1d4ed8 0%, #0ea5e9 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 80px rgba(15, 23, 42, 0.25);
      width: 100%;
      max-width: 420px;
      padding: 40px 36px;
    }
    .brand-badge {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(14, 165, 233, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0ea5e9;
      font-size: 28px;
      margin-bottom: 16px;
    }
    .form-control {
      border-radius: 12px;
      padding: 12px 16px;
    }
    .btn-primary {
      background: #1d4ed8;
      border: none;
      padding: 12px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-badge">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h3 class="fw-bold mb-1">Administrator Access</h3>
    <p class="text-muted mb-4">Sign in with your CareQueue admin credentials.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" class="mb-3">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="mb-3">
        <label class="form-label text-muted">Admin Email</label>
        <input type="email" class="form-control" name="email" placeholder="admin@gmail.com" value="{{ default_email }}" required>
      </div>
      <div class="mb-4">
        <label class="form-label text-muted">Password</label>
        <input type="password" class="form-control" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

    <div class="text-center">
      <a href="{{ url_for('index') }}" class="text-decoration-none">Back to home</a>
    </div>
  </div>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
